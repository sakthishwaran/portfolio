<main class="w-full max-w-full overflow-x-hidden">
  <h1 class="text-2xl md:text-3xl lg:text-4xl font-bold mb-6 md:mb-8">Skills</h1>
  <section class="grid grid-cols-1 lg:grid-cols-12 items-stretch gap-6 lg:gap-8">
    <div class="col-span-7">
      <div class="flex h-full min-w-0 flex-col rounded-2xl bg-white/30 p-4 md:p-6 lg:p-8">
        <h3 class="text-lg md:text-xl lg:text-2xl font-semibold mb-4 md:mb-6">Technical Skills</h3>
        <div
          #skillsSection
          class="grid flex-1 grid-cols-1 md:grid-cols-2 auto-rows-fr gap-4 md:gap-6"
        >
          @for (skill of skills(); track skill.id) {
            <app-skill-bar [skill]="skill"></app-skill-bar>
          }
        </div>
      </div>
    </div>
    <div class="col-span-5">
      <div class="flex h-full min-w-0 flex-col rounded-2xl bg-white/30 p-4 md:p-6 lg:p-8">
        <h3 class="text-lg md:text-xl lg:text-2xl font-semibold mb-4 md:mb-6">Professional Skills</h3>
        <div class="grid flex-1 grid-cols-1 md:grid-cols-2 auto-rows-fr gap-4 md:gap-6">
          @for (s of profile.professionalSkills; track $index) {
            <article
              class="flex h-full min-w-0 items-center rounded-2xl bg-white/10 backdrop-blur-xl shadow-lg p-3 md:p-4 transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl"
              role="listitem"
            >
              <div class="flex w-full min-w-0 items-center gap-3 md:gap-4">
                <div class="flex h-10 w-10 md:h-12 md:w-12 shrink-0 items-center justify-center rounded-lg bg-white/50 text-(--color-primary) dark:text-white">
                  <span class="text-lg md:text-xl text-red-600">★</span>
                </div>
                <div class="min-w-0 flex-1 truncate text-sm md:text-base font-medium">{{ s }}</div>
              </div>
            </article>
          }
        </div>
      </div>
    </div>
  </section>
</main>
