<main class="w-full max-w-full pb-15 overflow-x-hidden">
  <h1 class="text-2xl md:text-3xl lg:text-4xl font-bold mb-6 md:mb-8">Skills</h1>
  <section class="grid grid-cols-1 lg:grid-cols-12 items-stretch gap-6 lg:gap-8">
    <div class="col-span-6 xl:col-span-7">
      <div class="flex h-full min-w-0 flex-col">
        <h3 class="text-lg md:text-xl lg:text-2xl font-semibold mb-4 md:mb-6">Technical Skills</h3>
        <div class="premium-card p-4 md:p-6 lg:p-8">
          <div
            #skillsSection
            class="stagger grid flex-1 grid-cols-1 md:grid-cols-2 auto-rows-fr gap-4 md:gap-6"
          >
            @for (skill of skills(); track skill.id) {
              <app-skill-bar [skill]="skill"></app-skill-bar>
            }
          </div>
        </div>
      </div>
    </div>
    <div class="col-span-6 xl:col-span-5">
      <div class="flex h-full min-w-0 flex-col">
        <h3 class="text-lg md:text-xl lg:text-2xl font-semibold mb-4 md:mb-6">Professional Skills</h3>
        <div class="premium-card p-4 md:p-6 lg:p-8">
          <div class="grid flex-1 grid-cols-1 md:grid-cols-2 auto-rows-fr gap-4 md:gap-6">
            @for (s of profile.professionalSkills; track $index) {
              <article class="premium-card mini-card flex items-center gap-3" role="listitem">
                <div class="h-10 w-10 flex items-center justify-center rounded-full bg-white/10 text-(--color-primary) card-icon">
                  <span class="text-lg">★</span>
                </div>
                <div class="min-w-0 flex-1 truncate text-sm md:text-base font-medium">{{ s }}</div>
              </article>
            }
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
